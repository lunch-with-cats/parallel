<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dual Pane Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* --- レスポンシブ制御 --- */
        /* 表示パターン：小 (640px以下) */
        @media (max-width: 640px) {
            .pane {
                display: none !important;
                width: 100%;
            }
            .pane.active {
                display: flex !important;
            }
        }

        /* 表示パターン：大 (641px以上) */
        @media (min-width: 641px) {
            .pane {
                display: flex !important; 
                flex: 1;
            }
        }

        .pane.inactive {
            opacity: 0.7;
        }
        
        .flipped #flipIcon {
            transform: rotate(180deg);
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col font-sans text-slate-800">

    <!-- ヘッダー / ツールバー -->
    <header class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between shadow-sm">
        <h1 class="text-lg font-bold text-slate-700">Dual Text Editor</h1>
        
        <!-- コントロール群 -->
        <div class="flex items-center space-x-2">
            <!-- フォントサイズ変更ボタン -->
            <button id="sizeDownBtn" class="px-2.5 py-1 text-xs bg-slate-100 hover:bg-slate-200 rounded font-bold border border-slate-300">A-</button>
            <button id="sizeUpBtn" class="px-2.5 py-1 text-xs bg-slate-100 hover:bg-slate-200 rounded font-bold border border-slate-300">A+</button>
            
            <div class="h-4 w-[1px] bg-slate-300 mx-1"></div>

            <!-- コピー / クリア / All Clear ボタン -->
            <button id="copyBtn" class="px-3 py-1 text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-600 font-semibold rounded border border-indigo-200 transition">Copy</button>
            <button id="clearBtn" class="px-3 py-1 text-xs bg-rose-50 hover:bg-rose-100 text-rose-600 font-semibold rounded border border-rose-200 transition">Clear</button>
            
            <!-- 追加: All Clear ボタン -->
            <button id="allClearBtn" class="px-3 py-1 text-xs bg-red-600 hover:bg-red-700 text-white font-semibold rounded shadow-sm transition">All Clear</button>

            <!-- モバイル用反転トグルボタン -->
            <button id="flipToggle" class="sm:hidden ml-2 p-1.5 bg-slate-100 rounded border border-slate-300 transition-transform duration-300">
                <svg id="flipIcon" class="w-4 h-4 text-slate-600 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path>
                </svg>
            </button>
        </div>
    </header>

    <!-- エディタ領域 -->
    <main class="flex-1 flex flex-col sm:flex-row p-4 gap-4 max-w-7xl w-full mx-auto">
        <!-- ペイン A -->
        <div id="paneA" class="pane flex flex-col bg-white rounded-lg border border-slate-200 shadow-sm overflow-hidden transition-all">
            <div class="bg-slate-50 border-b border-slate-200 px-4 py-2 flex items-center justify-between">
                <h3 id="labelA" class="text-[11px] font-black text-slate-800 uppercase tracking-widest">Side: Light</h3>
                <span class="text-[10px] text-slate-400 font-mono">PANE A</span>
            </div>
            <textarea id="editorA" class="flex-1 w-full p-4 resize-none focus:outline-none text-slate-700 font-mono transition-all" placeholder="Type here..."></textarea>
        </div>

        <!-- ペイン B -->
        <div id="paneB" class="pane flex flex-col bg-white rounded-lg border border-slate-200 shadow-sm overflow-hidden transition-all">
            <div class="bg-slate-50 border-b border-slate-200 px-4 py-2 flex items-center justify-between">
                <h3 id="labelB" class="text-[11px] font-black text-slate-800 uppercase tracking-widest">Side: Shadow</h3>
                <span class="text-[10px] text-slate-400 font-mono">PANE B</span>
            </div>
            <textarea id="editorB" class="flex-1 w-full p-4 resize-none focus:outline-none text-slate-700 font-mono transition-all" placeholder="Type here..."></textarea>
        </div>
    </main>

    <!-- トースト通知 -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-xs px-4 py-2 rounded-full shadow-lg opacity-0 pointer-events-none transition-all duration-300 z-50">
        Notification
    </div>

    <!-- クリア確認ダイアログ -->
    <div id="confirmDialog" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 max-w-sm w-full mx-4 shadow-xl">
            <h4 class="font-bold text-slate-800 mb-2">クリアの確認</h4>
            <p id="confirmMessage" class="text-sm text-slate-600 mb-6">テキストを消去しますか？</p>
            <div class="flex justify-end space-x-3">
                <button id="confirmCancelBtn" class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded">キャンセル</button>
                <button id="confirmOkBtn" class="px-4 py-2 text-xs font-semibold bg-rose-600 hover:bg-rose-700 text-white rounded">消去する</button>
            </div>
        </div>
    </div>

    <script>
        const paneA = document.getElementById('paneA');
        const paneB = document.getElementById('paneB');
        const editorA = document.getElementById('editorA');
        const editorB = document.getElementById('editorB');
        const labelA = document.getElementById('labelA');
        const labelB = document.getElementById('labelB');
        const flipToggle = document.getElementById('flipToggle');
        
        const sizeUpBtn = document.getElementById('sizeUpBtn');
        const sizeDownBtn = document.getElementById('sizeDownBtn');
        const copyBtn = document.getElementById('copyBtn');
        const clearBtn = document.getElementById('clearBtn');
        const allClearBtn = document.getElementById('allClearBtn');
        
        const toast = document.getElementById('toast');
        const confirmDialog = document.getElementById('confirmDialog');
        const confirmMessage = document.getElementById('confirmMessage');
        const confirmCancelBtn = document.getElementById('confirmCancelBtn');
        const confirmOkBtn = document.getElementById('confirmOkBtn');

        const sizes = ['text-xs', 'text-sm', 'text-base', 'text-lg', 'text-xl'];
        let currentSizeIndex = 1;
        let activePaneId = 'A';
        let pendingClearMode = null; // 'active' (単一消去) または 'all' (全体消去)

        // 初期ロード時にローカルストレージから復元
        window.onload = () => {
            editorA.value = localStorage.getItem('p_a') || '';
            editorB.value = localStorage.getItem('p_b') || '';
            applyTextSize();
            updateActiveUI();
        };

        // UIの状態更新（アクティブ側の背景色やラベルを制御）
        function updateActiveUI() {
            const isA = activePaneId === 'A';

            paneA.className = `pane ${isA ? 'active ring-2 ring-indigo-500' : 'inactive'} flex flex-col`;
            paneB.className = `pane ${!isA ? 'active ring-2 ring-indigo-500' : 'inactive'} flex flex-col`;

            labelA.textContent = isA ? 'Side: Light' : 'Side: Shadow';
            labelB.textContent = !isA ? 'Side: Light' : 'Side: Shadow';

            if (isA) flipToggle.classList.remove('flipped');
            else flipToggle.classList.add('flipped');
        }

        // アクティブなペインの切り替え
        function setActivePane(id, focus = true) {
            if (activePaneId === id) return;
            activePaneId = id;
            updateActiveUI();
            if (focus) (id === 'A' ? editorA : editorB).focus();
        }

        // モバイル用反転トグルのイベント
        flipToggle.addEventListener('click', (e) => {
            e.preventDefault();
            setActivePane(activePaneId === 'A' ? 'B' : 'A');
            showToast('Flipped');
        });

        // エディタのフォーカス・入力イベント
        editorA.addEventListener('focus', () => setActivePane('A', false));
        editorB.addEventListener('focus', () => setActivePane('B', false));
        editorA.addEventListener('input', () => localStorage.setItem('p_a', editorA.value));
        editorB.addEventListener('input', () => localStorage.setItem('p_b', editorB.value));

        // フォントサイズの適用
        function applyTextSize() {
            [editorA, editorB].forEach(ed => {
                sizes.forEach(s => ed.classList.remove(s));
                ed.classList.add(sizes[currentSizeIndex]);
            });
        }

        sizeUpBtn.addEventListener('click', () => { 
            if (currentSizeIndex < sizes.length - 1) { 
                currentSizeIndex++; 
                applyTextSize(); 
            } 
        });
        sizeDownBtn.addEventListener('click', () => { 
            if (currentSizeIndex > 0) { 
                currentSizeIndex--; 
                applyTextSize(); 
            } 
        });

        // コピペ機能（クリップボード）
        copyBtn.addEventListener('click', () => {
            const val = (activePaneId === 'A' ? editorA : editorB).value;
            if (!val) return;
            
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(val).then(() => showToast('Copied'));
            } else {
                const el = document.createElement("textarea");
                el.value = val; 
                document.body.appendChild(el);
                el.select(); 
                document.execCommand('copy'); 
                document.body.removeChild(el);
                showToast('Copied');
            }
        });

        // トースト表示機能
        function showToast(msg) {
            toast.textContent = msg;
            toast.style.opacity = '1';
            toast.style.transform = 'translate(-50%, -8px)';
            setTimeout(() => { 
                toast.style.opacity = '0'; 
                toast.style.transform = 'translate(-50%, 0)'; 
            }, 1000);
        }

        // 単一ペイン消去 (Clear)
        clearBtn.addEventListener('click', () => {
            const currentVal = (activePaneId === 'A' ? editorA : editorB).value;
            if (currentVal.trim()) {
                pendingClearMode = 'active';
                confirmMessage.textContent = `現在選択中のペイン (${activePaneId}) のテキストを消去しますか？`;
                confirmDialog.classList.replace('hidden', 'flex');
            }
        });

        // 全消去 (All Clear)
        allClearBtn.addEventListener('click', () => {
            if (editorA.value.trim() || editorB.value.trim()) {
                pendingClearMode = 'all';
                confirmMessage.textContent = '両方のペインのテキストをすべて消去しますか？';
                confirmDialog.classList.replace('hidden', 'flex');
            }
        });

        // ダイアログのキャンセルボタン
        confirmCancelBtn.addEventListener('click', () => {
            confirmDialog.classList.replace('flex', 'hidden');
            pendingClearMode = null;
        });

        // ダイアログの決定ボタン
        confirmOkBtn.addEventListener('click', () => {
            if (pendingClearMode === 'active') {
                if (activePaneId === 'A') {
                    editorA.value = '';
                    localStorage.setItem('p_a', '');
                } else {
                    editorB.value = '';
                    localStorage.setItem('p_b', '');
                }
                showToast('Cleared');
            } else if (pendingClearMode === 'all') {
                editorA.value = '';
                editorB.value = '';
                localStorage.setItem('p_a', '');
                localStorage.setItem('p_b', '');
                showToast('All Cleared');
            }
            confirmDialog.classList.replace('flex', 'hidden');
            pendingClearMode = null;
        });
    </script>
</body>
</html>
